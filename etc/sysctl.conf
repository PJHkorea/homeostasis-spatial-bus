# =========================================================================
# Homeostasis Spatial Bus - Kernel Network Tuning Guard
# File: /etc/sysctl.conf
# =========================================================================

# 1. 최전방 인입 링버퍼 백로그 고공 확장 (SoftIRQ 드레인 랙 분쇄)
net.core.netdev_max_backlog = 100000

# 2. 커널 전역 네트워크 메모리 수치해석 상한선 해제 (128MB 정적 래치)
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 67108864
net.core.wmem_default = 67108864

# 3. UDP 프로토콜 배치 버퍼 공간의 물리적 고정선 선점
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.udp_mem = 4194304 8388608 16777216

# 4. CPU 코어가 한 사이클당 드레인할 수 있는 패킷 가중치 상한선 격상
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000
